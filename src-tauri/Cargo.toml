# The workspace is the shell and the core beside it. `cargo test --workspace`
# runs both, and `pnpm test:shell` is that line: a solver with no test that runs
# is a solver nobody is holding to anything.
[workspace]
members = ["core"]

[package]
name = "roofnerd"
version = "0.0.0"
description = "Roofing estimating software"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "roofnerd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The solvers. Rust owns the model — the tapered package, the walls, the
# fastening — and the shell calls in there and hands the answer to every window
# (Patrick, 2026-09-12; D146). It brings no window, no disk and no network with
# it, so it can be tested with nothing on screen.
roofnerd-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# No `preserve_order`: serde_json then backs objects with a BTreeMap and writes
# keys sorted, which is the same canonical form packages/engine/src/job.ts
# produces. A job saved by the application and a job saved by the command line
# are byte-identical, and `roofnerd check` proves it.
serde_json = "1"
tauri-plugin-dialog = "2"
