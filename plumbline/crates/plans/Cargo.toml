[package]
name = "plumbline-plans"
description = "Plan files read for tracing over: a page of a PDF, or a picture, as pixels and the straight lines drawn on it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# A PDF page drawn to pixels on the processor, and each path it draws handed to us.
hayro = "0.9.0"
# PNG and JPEG pictures of plans, and aerial pictures.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
