[workspace]
resolver = "2"
members = ["crates/world", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# The world: entities and components. The ECS only, not the engine.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: fields are written in the order the structs declare them, so the file reads value, unit, status, source.
# float_roundtrip: a number read from a file is written back as the same number.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Solid geometry for clash detection: do two shapes overlap, and how far apart are they.
# The 64-bit build, without the triangulation it can also do.
parry3d-f64 = { version = "0.31.1", default-features = false, features = ["required-features", "std", "alloc"] }
