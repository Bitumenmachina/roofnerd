<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>roofnerd</title>
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <!-- Every window has the same anatomy, top to bottom: the document bar,
         the tool settings strip, the body — tool rail, surface, cost panel —
         and the status strip. The regions are fixed; only the surface flexes.
         The cost panel detached onto a second monitor is the same panel in a
         window of its own, over the same document. -->
    <header id="doc-bar" class="doc-bar"></header>
    <div id="tool-strip" class="tool-strip"></div>
    <div id="body-row" class="body-row">
      <nav id="tool-rail" class="tool-rail" aria-label="Tools"></nav>
      <div id="surface-region" class="surface-region">
        <div id="editor"></div>
      </div>
      <aside id="cost-panel" class="cost-panel" aria-label="Cost"></aside>
    </div>
    <footer id="status-strip" class="status-strip"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
